name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t sachinxsharma/sachin-portfolio:latest .

      - name: Push Docker Image
        run: |
          docker push sachinxsharma/sachin-portfolio:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull sachinxsharma/sachin-portfolio:latest

            docker stop sachin-portfolio || true
            docker rm sachin-portfolio || true

            docker run -d \
              --name sachin-portfolio \
              -p 3000:3000 \
              sachinxsharma/sachin-portfolio:latest
